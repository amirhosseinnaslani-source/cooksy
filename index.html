<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183c2d">
  <title>Cooksy — Hello World</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f3e9; color: #183c2d; }
    main { max-width: 540px; padding: 48px 28px; text-align: center; }
    .icon { font-size: 72px; }
    h1 { font-size: clamp(3rem, 9vw, 5rem); letter-spacing: -0.06em; margin: 12px 0; }
    p { font-size: 1.2rem; line-height: 1.6; }
    .tag { display: inline-block; padding: 8px 18px; background: #d8e9d5; border-radius: 999px; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🥬</div>
    <h1>Hello, Cooksy!</h1>
    <p>Fresh ideas for better food. Our kitchen is warming up.</p>
    <span class="tag">Coming soon</span>
  </main>
</body>
</html>
