name: cooksy
services:
  web:
    image: ${COOKSY_IMAGE:-cooksy:local}
    container_name: cooksy-web
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - cooksy_orders:/data
    networks:
      app-net:
        aliases:
          - cooksy-web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
volumes:
  cooksy_orders:
networks:
  app-net:
    external: true
    name: app-net
